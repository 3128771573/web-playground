<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let running = !reducedMotion.matches;
  let speed = 1, time = 0, last = null, velocity = 0, acceleration = 0;
  const button = $('toggle');
  const nodes = Object.fromEntries(['rider', 'bird', 'eye', 'scarfTail', 'crank', 'farLeg', 'nearLeg', 'nearLegHighlight', 'farFoot', 'nearFoot', 'farPedal', 'nearPedal', 'roadMarks', 'shadow'].map(id => [id, $(id)]));
  // Clone the rotating spokes above each static wheel face.
  const spokeTemplate = document.querySelector('#wheel .spokes');
  const spins = [$('rearSpin'), $('frontSpin')];
  spins.forEach(spin => spin.appendChild(spokeTemplate.cloneNode(true)));
  // Hide spokes in the referenced wheel; the clones rotate independently.
  spokeTemplate.setAttribute('visibility', 'hidden');
  const setTransform = (node, value) => node.setAttribute('transform', value);
  const routes = {
    coast: { subtitle: '海风刚刚好，今天不赶路。', label: '沿着海岸 · 慢慢向前', number: 'COASTAL ROUTE — 01', caption: '第一程 · 把心事交给海风', title: '一只系橘色围巾的鹈鹕，经过灯塔和帆船，在海岸边骑行' },
    meadow: { subtitle: '穿过花开的原野，让风车慢慢转。', label: '漫过花野 · 春光作伴', number: 'MEADOW ROUTE — 02', caption: '第二程 · 每一朵花都值得路过', title: '鹈鹕骑过柔绿的田园，远处风车旋转，路边春花随风而过' },
    sakura: { subtitle: '风经过樱花林，落了一路粉色的春天。', label: '穿过樱林 · 花雨轻落', number: 'SAKURA ROUTE — 03', caption: '第三程 · 借一阵风，赴一场花开', title: '鹈鹕骑入粉色樱花林，层叠的花冠映着柔光，带缺口的樱花瓣随风旋落' },
    osmanthus: { subtitle: '碧叶藏着点点金黄，小径有了秋天的香。', label: '走进桂径 · 暖金作伴', number: 'OSMANTHUS ROUTE — 04', caption: '第四程 · 桂花很小，温柔刚好', title: '鹈鹕骑过桂花小径，常绿的树冠间缀着成簇四瓣金桂，细小花朵轻轻飘落' },
    autumn: { subtitle: '湖面藏着暖阳，落叶写着秋天。', label: '路过秋湖 · 捡一束光', number: 'AUTUMN ROUTE — 05', caption: '第五程 · 在金色的午后多停一会', title: '鹈鹕在秋日湖畔骑行，赭金色树叶缓缓飘落，湖面映着暖阳' },
    night: { subtitle: '月亮陪你回家，流萤照亮小路。', label: '骑入月色 · 星光同行', number: 'MOONLIT ROUTE — 06', caption: '第六程 · 山谷安静，月色温柔', title: '鹈鹕在月夜的山谷中骑行，松林、湖中月影与流萤陪伴归途' }
  };
  let activeRoute = 'coast', tourElapsed = 0, transition = null, queuedRoute = null;
  const routeButtons = Array.from(document.querySelectorAll('[data-route]'));
  const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
  const ease = x => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10); };
  function routeCopy(name) {
    const route = routes[name];
    document.body.dataset.scene = name;
    $('sceneSubtitle').textContent = route.subtitle;
    $('sceneLabel').textContent = route.label;
    $('sceneNumber').textContent = route.number;
    $('art-title').textContent = route.title;
  }
  function routeSelection(name) {
    routeButtons.forEach(item => {
      item.setAttribute('aria-pressed', String(item.dataset.route === name));
      item.classList.toggle('is-pending', item.dataset.route === queuedRoute);
    });
  }
  function selectRoute(name) {
    if (!routes[name]) return;
    tourElapsed = 0;
    if (transition) {
      // Keep the current crossing continuous; remember only the latest destination.
      queuedRoute = name === transition.to ? null : name;
      routeSelection(name);
      $('journeyCaption').textContent = queuedRoute ? `下一程 · ${routes[name].label}` : `正在前往 · ${routes[name].label}`;
      return;
    }
    if (name === activeRoute) return;
    queuedRoute = null;

    if (reducedMotion.matches) {
      showWorld(worlds[activeRoute], false);
      activeRoute = name;
      showWorld(worlds[name], true);
      routeCopy(name);
      $('journeyCaption').textContent = routes[name].caption;
      draw(time);
      return;

    transition = { from: activeRoute, to: name, elapsed: 0, duration: 4.2, progress: 0, copied: false };
    const next = worlds[name];
    showWorld(next, true);
    next.back.parentNode.appendChild(next.back);
    next.front.parentNode.appendChild(next.front);
    next.back.setAttribute('mask', 'url(#travel-back-mask)');
    next.front.setAttribute('mask', 'url(#travel-front-mask)');
    worlds[activeRoute].front.setAttribute('mask', 'url(#travel-front-out-mask)');

    $('journeyCaption').textContent = `正在前往 · ${routes[name].label}`;
    updateTransition(0);
  }
  function showWorld(world, visible) {

  function updateTransition(dt) {
    if (!transition) return;
    const trip = transition;
    trip.elapsed += dt;
    const progress = ease(trip.elapsed / trip.duration);
    trip.progress = progress;
    // A narrow feathered front travels from the road ahead (right) to behind (left).
    // Foreground crosses a little earlier than the horizon, providing depth.
    const seam = 1300 - 1480 * progress;
    [backFront, frontFront, frontOut].forEach((gradient, i) => {
      const edge = seam - (i ? 65 : 0) * Math.sin(progress * Math.PI);
      gradient.setAttribute('x1', edge - 70);
      gradient.setAttribute('x2', edge + 70);
    });
    if (!trip.copied && progress >= .5) { routeCopy(trip.to); trip.copied = true; }
    if (trip.elapsed >= trip.duration) {
      showWorld(worlds[trip.from], false);
      showWorld(worlds[trip.to], true);
      activeRoute = trip.to;
      transition = null;
      tourElapsed = 0;
      $('scene').setAttribute('aria-busy', 'false');
      const next = queuedRoute;
      queuedRoute = null;
      routeSelection(next || activeRoute);
      $('journeyCaption').textContent = routes[activeRoute].caption;
      if (next && next !== activeRoute) selectRoute(next);
    }
  }
  routeButtons.forEach(item => item.addEventListener('click', () => selectRoute(item.dataset.route)));
  $('autoTour').addEventListener('change', () => { tourElapsed = 0; });
  function updateButton() {
    button.classList.toggle('paused', !running);
    button.setAttribute('aria-label', running ? '缓缓停下' : '缓缓出发');
    const text = running ? (velocity < speed * .85 ? '缓缓出发' : '歇一小会') : (velocity > .015 ? '慢慢停下' : '继续出发');
    if ($('toggleText').textContent !== text) $('toggleText').textContent = text;
  }
  button.addEventListener('click', () => { running = !running; updateButton(); });
  $('speed').addEventListener('input', event => {
    speed = Number(event.target.value);
    $('speedValue').value = speed.toFixed(1) + '×';
  });
  reducedMotion.addEventListener('change', event => {
    if (event.matches) {

      if (transition) { queuedRoute = null; updateTransition(transition.duration); }
      updateButton(); draw(time);
    }
  });
  document.addEventListener('visibilitychange', () => { last = null; });
  function leg(side, angle, bob) {
    const x = 548 + 28 * Math.cos(angle), y = 420 + 28 * Math.sin(angle);
    const hx = side === 'near' ? 516 : 502, hy = 284 + bob;

    const dx = x - hx, dy = y - hy, distance = Math.hypot(dx, dy);

    const a = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const h = Math.sqrt(Math.max(0, upper * upper - a * a));

    const ky = hy + a * dy / distance + h * dx / distance;

    nodes[side + 'Leg'].setAttribute('d', d);
    if (side === 'near') nodes.nearLegHighlight.setAttribute('d', `M${kx + 1} ${ky}L${x + 1} ${y - 8}`);
    nodes[side + 'Foot'].setAttribute('d', `M${x - 5} ${y - 9}Q${x + 5} ${y - 12} ${x + 12} ${y - 5}L${x + 24} ${y - 1}Q${x + 28} ${y + 4} ${x + 19} ${y + 4}L${x - 8} ${y + 3}Z`);
    nodes[side + 'Pedal'].setAttribute('x', x - 11);
    nodes[side + 'Pedal'].setAttribute('y', y + 4);
  }
  function draw(t) {
    const angle = t * 2.7, degrees = angle * 180 / Math.PI;
    const motion = clamp(velocity);
    const bob = Math.sin(angle * 2) * 2 * motion;
    setTransform(nodes.rider, `translate(0 ${Math.sin(angle * 2) * .8 * motion})`);
    setTransform(nodes.bird, `translate(0 ${bob})`);
    spins.forEach(spin => setTransform(spin, `rotate(${degrees * 1.65})`));
    setTransform(nodes.crank, `rotate(${degrees} 548 420)`);
    leg('far', angle + Math.PI, bob);
    leg('near', angle, bob);
    const flutter = Math.sin(t * 5) * 6 * motion;
    nodes.scarfTail.setAttribute('d', `M590 187Q551 ${170 + flutter} 519 189T456 ${176 - flutter}L465 ${197 - flutter}Q501 ${214 + flutter} 526 201T590 200Z`);
    const blink = t % 5.4 > 5.23 ? 1 - .88 * motion : 1;
    setTransform(nodes.eye, `translate(0 ${112 * (1 - blink)}) scale(1 ${blink})`);
    nodes.roadMarks.setAttribute('patternTransform', `translate(${-((t * 2.7 * 1.65 * 79) % 240)} 0)`);
    nodes.shadow.setAttribute('rx', 224 + bob * 1.3);
    const shown = transition ? [transition.from, transition.to] : [activeRoute];
    shown.forEach(name => drawWorld(worlds[name], t));
    let night = activeRoute === 'night' ? 1 : 0;
    if (transition) {
      const local = ease((transition.progress - .35) / .3);
      night = (transition.from === 'night' ? 1 : 0) * (1 - local) + (transition.to === 'night' ? 1 : 0) * local;
    }
    nodes.rider.style.filter = `brightness(${1 - .12 * night}) saturate(${1 - .22 * night})`;
    sails.forEach(node => setTransform(node, `rotate(${t * 16} 0 -69)`));
  }
  function drawWorld(world, t) {
    const slide = transition ? (world.name === transition.to ? 100 * (1 - transition.progress) : -100 * transition.progress) : 0;
    world.scenery.forEach(({node, rate, period}) => {
      const shift = slide * Math.min(1.5, rate / 65);
      setTransform(node, `translate(${-((t * rate - shift + period) % period)} 0)`);
    });
    world.particles.forEach(({node, kind, index}) => {
      const seed = index * 173 + (kind === 'firefly' ? 91 : 0);
      if (kind === 'firefly') {
        const x = (seed % 1080) + 20 + Math.sin(t * .6 + index) * 17;
        const y = 330 + (index * 37 % 158) + Math.sin(t * .85 + index * 2) * 12;
        setTransform(node, `translate(${x} ${y})`);
        node.setAttribute('opacity', .25 + .65 * (Math.sin(t * 1.5 + index * 2.3) + 1) / 2);
      } else {
        if (kind === 'sakura' || kind === 'osmanthus') {
          const cherry = kind === 'sakura';
          const drift = cherry ? 26 : 17, fall = cherry ? 20 : 14;
          const x = 1220 - ((t * drift + seed) % 1340) + Math.sin(t * .8 + index * 1.7) * (cherry ? 24 : 10);
          const y = -50 + ((index * 97 + t * fall) % 720);
          const size = (cherry ? .6 : .5) + (index % 4) * .12;
          const flutter = cherry ? .65 + Math.sin(t * 1.4 + index) * .25 : 1;
          setTransform(node, `translate(${x} ${y}) rotate(${index * 37 + t * (cherry ? 21 : 12)}) scale(${size * flutter} ${size})`);
          node.setAttribute('opacity', .8 * ease((y + 50) / 65) * (1 - ease((y - 555) / 80)));
        } else {
          const x = 1190 - ((t * (kind === 'leaf' ? 40 : 29) + seed) % 1270);
          const y = 190 + ((index * 47 + t * (kind === 'leaf' ? 13 : 6)) % 380);
          setTransform(node, `translate(${x} ${y}) rotate(${index * 41 + t * 30}) scale(${.65 + (index % 3) * .17})`);
        }
      }
    });
    if (world.nodes.stars) world.nodes.stars.setAttribute('opacity', .75 + Math.sin(t * .7) * .15);
  }
  // Duplicate scenery tiles for seamless motion, without external assets.
  function duplicateChildren(group, width) {
    const copy = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    Array.from(group.children).forEach(child => copy.appendChild(child.cloneNode(true)));
    setTransform(copy, `translate(${width} 0)`);
    group.appendChild(copy);
    return copy;
  }
  const svgNS = 'http://www.w3.org/2000/svg';
  const create = (tag, attrs = {}) => {
    const node = document.createElementNS(svgNS, tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  };
  const defs = document.querySelector('#scene > defs');
  function travelMask(id, reverse = false) {
    const gradient = create('linearGradient', { id: `${id}-edge`, gradientUnits: 'userSpaceOnUse', x1: 1230, x2: 1370, y1: 0, y2: 0 });
    gradient.appendChild(create('stop', {offset: 0, 'stop-color': reverse ? '#fff' : '#000'}));
    gradient.appendChild(create('stop', {offset: 1, 'stop-color': reverse ? '#000' : '#fff'}));
    const mask = create('mask', {id, maskUnits: 'userSpaceOnUse', maskContentUnits: 'userSpaceOnUse', x: 0, y: 0, width: 1120, height: 580, 'mask-type': 'luminance'});
    mask.appendChild(create('rect', {width: 1120, height: 580, fill: `url(#${id}-edge)`}));
    defs.appendChild(gradient); defs.appendChild(mask);
    return gradient;
  }
  const backFront = travelMask('travel-back-mask'), frontFront = travelMask('travel-front-mask');
  const frontOut = travelMask('travel-front-out-mask', true);
  const backgroundTemplate = $('sceneBack'), foregroundTemplate = $('sceneFront');
  const backHost = create('g', {id: 'backgroundWorlds'}), frontHost = create('g', {id: 'foregroundWorlds'});
  backgroundTemplate.replaceWith(backHost); foregroundTemplate.replaceWith(frontHost);
  const paletteKeys = ['sky-top', 'sky-bottom', 'water-top', 'water-bottom', 'hill', 'bank', 'road', 'edge', 'sun'];
  const palettes = {
    coast: ['#e7eee2', '#f6f1d9', '#b8d3c7', '#d3dfc9', '#c8d8bd', '#bdc99e', '#d5d3b6', '#e9e4c6', '#f3d78f'],
    meadow: ['#e6eddf', '#faf0d5', '#c5d3a4', '#b4c58e', '#d0dbb8', '#a8bc89', '#dbd2b3', '#eee6cd', '#f4dc9d'],
    sakura: ['#f1dee5', '#fff0e5', '#e3cbd1', '#ecd8d5', '#dac6cf', '#d4bcc1', '#e7d3cc', '#f9e8e2', '#f9e2bc'],
    osmanthus: ['#e7e9d6', '#fbefc9', '#c5cfaa', '#d3d3a9', '#c8cfad', '#b8c18e', '#d9cea7', '#f1e5bf', '#f3d48a'],
    autumn: ['#edddcb', '#f9e8c6', '#b9c6b1', '#d5d2ad', '#d4c2a0', '#c9b388', '#d9c4a5', '#f0dfc1', '#ecc181'],
    night: ['#334854', '#82918d', '#6a8789', '#91a5a0', '#66817e', '#748d80', '#9aa998', '#bbc5ae', '#f3edce']
  };
  // Independent worlds keep day/night palettes and moving scenery isolated during the crossing.
  function buildWorld(name) {
    const world = { name, back: backgroundTemplate.cloneNode(true), front: foregroundTemplate.cloneNode(true), nodes: {}, scenery: [], particles: [] };
    [world.back, world.front].forEach((group, index) => {
      group.id = `${name}-${index ? 'front' : 'back'}`;
      group.classList.add('world'); group.dataset.world = name;
      paletteKeys.forEach((key, i) => group.style.setProperty(`--${key}`, palettes[name][i]));
      group.querySelectorAll('[data-landscape]').forEach(layer => {
        if (layer.dataset.landscape !== name) layer.remove();
        else layer.classList.add('is-visible');
      });
      group.querySelectorAll('[id]').forEach(node => {
        const original = node.id;
        node.dataset.node = original; node.id = `${name}-${original}`;
        world.nodes[original] = node;
      });
      group.querySelectorAll('[fill]').forEach(node => {
        const fill = node.getAttribute('fill');
        if (fill === 'url(#sky)' || fill === 'url(#sea)') node.setAttribute('fill', fill.replace('#', `#${name}-`));
      });
    });
    ['sky', 'sea'].forEach((type, index) => {
      const gradient = create('linearGradient', {id: `${name}-${type}`, x2: 0, y2: 1});
      gradient.appendChild(create('stop', {offset: 0, 'stop-color': palettes[name][index * 2]}));
      gradient.appendChild(create('stop', {offset: 1, 'stop-color': palettes[name][index * 2 + 1]}));
      defs.appendChild(gradient);
    });
    const addScenery = (node, rate, period) => {
      if (!node) return;
      duplicateChildren(node, period);
      world.scenery.push({node, rate, period});
    };
    addScenery(world.nodes.clouds, 7, 1250);
    addScenery(world.nodes.waves, 19, 1120);
    addScenery(world.nodes.plantsBack, 92, 1300);
    addScenery(world.nodes.plantsFront, 165, 1300);
    [world.back, world.front].forEach(group => group.querySelectorAll('[data-drift]').forEach(node => addScenery(node, Number(node.dataset.drift), Number(node.dataset.period))));
    backHost.appendChild(world.back); frontHost.appendChild(world.front);
    showWorld(world, name === activeRoute);
    return world;
  }
  const worlds = Object.fromEntries(Object.keys(routes).map(name => [name, buildWorld(name)]));
  // The sails live inside the reusable windmill symbol, so all its instances move together.
  const sails = Array.from(document.querySelectorAll('.windmill-sails'));
  Object.values(worlds).forEach(world => {
  [['petals', 'petal', 9], ['leaves', 'leaf', 12], ['fireflies', 'firefly', 17], ['sakuraPetals', 'sakura', 30], ['osmanthusFlorets', 'osmanthus', 22]].forEach(([id, kind, count]) => {
    if (!world.nodes[id]) return;
    for (let index = 0; index < count; index++) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      if (kind === 'firefly') {
        [7, 2].forEach((radius, i) => {
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('r', radius);
          dot.setAttribute('opacity', i ? '.9' : '.12');
          node.appendChild(dot);
        });
      } else if (kind === 'sakura' || kind === 'osmanthus') {
        const shape = create('use', {href: kind === 'sakura' ? '#sakuraPetal' : '#osmanthusBloom'});
        const colors = kind === 'sakura' ? ['#e8afc5', '#f8dce6', '#d796b3', '#fff0f3'] : ['#e7bc65', '#f4d887', '#d9aa53', '#f8e5a3'];
        shape.setAttribute('fill', colors[index % 4]);
        shape.setAttribute('color', colors[index % 4]);
        node.appendChild(shape);
      } else {
        const shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        shape.setAttribute('d', kind === 'leaf' ? 'M-8-2Q0-13 10-5Q7 7-8-2Z' : 'M-5 0Q-2-8 5-4Q9 3 0 5Z');
        if (kind === 'leaf') shape.setAttribute('fill', ['#bb8757', '#d1a168', '#aa8056'][index % 3]);
        node.appendChild(shape);
      }
      world.nodes[id].appendChild(node);
      world.particles.push({node, kind, index});
    }
  });
  });
  function advanceMotion(dt) {
    const target = running ? speed : 0;
    // Exact critically damped response: preserve velocity AND acceleration on retargeting.
    // Integration uses the same curve, keeping wheels, pedals and ground phase-locked.
    const omega = 5.5, offset = velocity - target;
    const impulse = acceleration + omega * offset, decay = Math.exp(-omega * dt);
    const distance = target * dt + offset * (1 - decay) / omega + impulse * (1 - (1 + omega * dt) * decay) / (omega * omega);

  }
  function frame(now) {
    if (last !== null && !document.hidden) {
      const dt = Math.min((now - last) / 1000, 0.05);
      advanceMotion(dt);
      updateTransition(dt);
      if (running && !transition && $('autoTour').checked) {
        tourElapsed += dt;
        if (tourElapsed >= 18) {
          const names = Object.keys(routes);
          selectRoute(names[(names.indexOf(activeRoute) + 1) % names.length]);

    draw(time);
    updateButton();
    requestAnimationFrame(frame);
  }
  updateButton();
  draw(0);
  requestAnimationFrame(frame);
})();
</script>
